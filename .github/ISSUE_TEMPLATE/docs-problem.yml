name: Documentation problem
description: Report a wrong, missing, or confusing page on the LLAM site.
title: "[Docs] "
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: |
        **Do not report security defects here.** Submit them privately at
        https://github.com/Feralthedogg/LLAM/security/advisories/new.

  - type: input
    id: page
    attributes:
      label: Page
      description: The address of the page. The page's Report a problem link fills this in.
      placeholder: https://feralthedogg.github.io/LLAM/start/quickstart/
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is wrong
      description: Quote the text or code that is wrong, missing, or hard to follow.
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: What it should say
      description: Optional. A correction, or what you expected to find.
