name: LEIR Linux Native Segment Research

on:
  pull_request:
    paths:
      - ".github/workflows/leir-native-research.yml"
      - "experiments/leir/**"
      - "src/io/linux/watch/**"
      - "src/internal/io/**"
      - "scripts/bench_leir_native.py"
      - "scripts/test_bench_leir_native.py"
      - "scripts/process_utils.py"
      - "scripts/test_process_utils.py"
      - "scripts/verify_linux.sh"
      - "CMakeLists.txt"
      - "Makefile"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leir-native-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evidence:
    name: linux-x86_64-screen
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OUT_DIR: .artifacts/leir-native-screen

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Verify exact source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install Linux research toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            cmake \
            liburing-dev \
            pkg-config \
            util-linux

      - name: Record source and runner environment
        run: |
          mkdir -p "$OUT_DIR"
          {
            echo "event_sha=$GITHUB_SHA"
            echo "source_sha=$(git rev-parse HEAD)"
          } | tee "$OUT_DIR/source.txt"
          {
            uname -a
            lscpu
            gcc --version
            clang --version
            cmake --version
            python3 --version
            pkg-config --modversion liburing
            taskset --version
            taskset -pc $$
            git rev-parse HEAD
          } > "$OUT_DIR/environment.txt"

      - name: Make native segment gate
        shell: bash
        run: |
          set -o pipefail
          make clean
          make -j2 test-leir-native \
            CC=gcc \
            CFLAGS="-std=c11 -Wall -Wextra -Wpedantic -Werror -O3 -g -fno-omit-frame-pointer" \
            2>&1 | tee "$OUT_DIR/make-test-leir-native.log"
          make -j2 test_leir_native_linux CC=gcc \
            2>&1 | tee "$OUT_DIR/make-native-linux-build.log"
          ./test_leir_native_linux \
            2>&1 | tee "$OUT_DIR/make-native-linux-test.log"

      - name: Probe kernel native feature status
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts")
          from process_utils import ProcessTimeoutError, run_capture

          out_dir = Path(os.environ["OUT_DIR"])
          command = [
              "./bench_leir_native_segment",
              "--candidate", "link_skip",
              "--ops", "4",
              "--concurrency", "4",
              "--payload", "64",
              "--activations", "8",
              "--min-mode-ms", "1",
              "--order", "ABBA",
          ]
          try:
              probe = run_capture(
                  command,
                  timeout=30,
                  max_output_bytes=64 * 1024,
              )
          except ProcessTimeoutError as exc:
              (out_dir / "feature-probe.stdout").write_text(
                  exc.stdout, encoding="utf-8"
              )
              (out_dir / "feature-probe.stderr").write_text(
                  exc.stderr, encoding="utf-8"
              )
              raise SystemExit(124)

          (out_dir / "feature-probe.stdout").write_text(
              probe.stdout, encoding="utf-8"
          )
          (out_dir / "feature-probe.stderr").write_text(
              probe.stderr, encoding="utf-8"
          )
          if probe.stdout_truncated or probe.stderr_truncated:
              raise SystemExit("feature probe exceeded output cap")
          if probe.returncode == 0:
              status = "available"
          elif probe.returncode == 77:
              status = "unavailable"
              print(probe.stderr, end="")
          else:
              print(probe.stdout, end="")
              print(probe.stderr, end="", file=sys.stderr)
              raise SystemExit(probe.returncode)
          text = f"linux_io_uring_native={status}\n"
          (out_dir / "feature-status.txt").write_text(
              text, encoding="utf-8"
          )
          print(text, end="")
          PY

      - name: Clang CMake native gate
        shell: bash
        run: |
          set -o pipefail
          cmake -S . -B object/leir-native-ci-cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_ASM_COMPILER=clang \
            2>&1 | tee "$OUT_DIR/cmake-configure.log"
          cmake --build object/leir-native-ci-cmake \
            --target \
              test_leir_native_plan \
              test_leir_native_segment \
              test_leir_native_linux \
              bench_leir_native_segment \
            -j2 2>&1 | tee "$OUT_DIR/cmake-build.log"
          ctest --test-dir object/leir-native-ci-cmake \
            --output-on-failure \
            --timeout 180 \
            -R "test_leir_native_plan|test_leir_native_segment|test_bench_leir_native" \
            2>&1 | tee "$OUT_DIR/ctest.log"
          ./object/leir-native-ci-cmake/test_leir_native_linux \
            2>&1 | tee "$OUT_DIR/cmake-native-linux-test.log"

      - name: ASan and UBSan native integration gate
        shell: bash
        run: |
          set -o pipefail
          cmake -S . -B object/leir-native-ci-asan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_ASM_COMPILER=gcc \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            2>&1 | tee "$OUT_DIR/asan-configure.log"
          cmake --build object/leir-native-ci-asan \
            --target test_leir_native_segment test_leir_native_linux \
            -j2 2>&1 | tee "$OUT_DIR/asan-build.log"
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
            UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            ./object/leir-native-ci-asan/test_leir_native_segment \
            2>&1 | tee "$OUT_DIR/asan-segment-test.log"
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
            UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            ./object/leir-native-ci-asan/test_leir_native_linux \
            2>&1 | tee "$OUT_DIR/asan-linux-test.log"

      - name: TSan native integration gate
        shell: bash
        run: |
          set -o pipefail
          cmake -S . -B object/leir-native-ci-tsan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_ASM_COMPILER=gcc \
            -DCMAKE_C_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread" \
            2>&1 | tee "$OUT_DIR/tsan-configure.log"
          cmake --build object/leir-native-ci-tsan \
            --target test_leir_native_segment test_leir_native_linux \
            -j2 2>&1 | tee "$OUT_DIR/tsan-build.log"
          TSAN_OPTIONS=halt_on_error=1 \
            ./object/leir-native-ci-tsan/test_leir_native_segment \
            2>&1 | tee "$OUT_DIR/tsan-segment-test.log"
          TSAN_OPTIONS=halt_on_error=1 \
            ./object/leir-native-ci-tsan/test_leir_native_linux \
            2>&1 | tee "$OUT_DIR/tsan-linux-test.log"

      - name: Full runtime regression and export gates
        shell: bash
        run: |
          set -o pipefail
          make clean
          make -j2 test CC=gcc \
            2>&1 | tee "$OUT_DIR/make-test.log"
          make -j2 shared audit-shared-exports \
            audit-production-test-hooks CC=gcc \
            2>&1 | tee "$OUT_DIR/export-audit.log"
          JOBS=2 scripts/verify_linux.sh \
            2>&1 | tee "$OUT_DIR/verify-linux.log"

      - name: Run pinned native screen
        shell: bash
        run: |
          set -o pipefail
          server_cpu="$(
            python3 - <<'PY'
          import os
          print(min(os.sched_getaffinity(0)))
          PY
          )"
          {
            echo "server_cpu=$server_cpu"
            echo "allowed_cpus=$(taskset -pc $$)"
          } | tee "$OUT_DIR/affinity.txt"
          taskset -c "$server_cpu" \
            python3 scripts/bench_leir_native.py \
              --binary ./bench_leir_native_segment \
              --phase screen \
              --samples 5 \
              --min-mode-ms 100 \
              --output-dir "$OUT_DIR" \
              --tracked-report \
                "$OUT_DIR/leir_native_tracked_report.md" \
            2> >(tee "$OUT_DIR/runner-stderr.log" >&2) |
            tee "$OUT_DIR/runner-stdout.log"
          cmp \
            "$OUT_DIR/leir_native_report.md" \
            "$OUT_DIR/leir_native_tracked_report.md"

      - name: Upload LEIR native evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: leir-native-screen-linux-x86_64
          path: .artifacts/leir-native-screen
          if-no-files-found: error
