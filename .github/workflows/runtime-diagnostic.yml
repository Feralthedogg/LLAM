name: Runtime diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  linux-sanitizer-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install debugger and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential gdb ca-certificates git python3
      - name: Build matching liburing
        run: |
          liburing_dir="$(mktemp -d "${TMPDIR:-/tmp}/llam-liburing.XXXXXX")"
          trap 'rm -rf "$liburing_dir"' EXIT
          git init "$liburing_dir"
          git -C "$liburing_dir" remote add origin https://github.com/axboe/liburing.git
          git -C "$liburing_dir" fetch --depth 1 origin e3d35ea59d3ba09075ed4d7751e4bb9049cce64a
          git -C "$liburing_dir" checkout --detach FETCH_HEAD
          make -C "$liburing_dir" -j4
          sudo make -C "$liburing_dir" install
          sudo ldconfig
      - name: Build the original sanitizer targets
        run: |
          make -j4 CC=gcc asan-test_execution_lease_internal asan-test_managed_scheduler_internal \
            OBJDIR=object-asan SANITIZER_TARGETS_ENABLED=1 \
            CFLAGS="-std=c11 -Wall -Wextra -Wpedantic -Werror -O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined" \
            LDLIBS="-pthread -luring -lm -ldl -fsanitize=address,undefined"
      - name: Capture native failure stacks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import subprocess

          out = Path('.artifacts/runtime-diagnostic')
          out.mkdir(parents=True, exist_ok=True)
          for name in ('asan-test_execution_lease_internal', 'asan-test_managed_scheduler_internal'):
              native_failed = False
              for iteration in range(1, 51):
                  env = dict(os.environ, ASAN_OPTIONS='halt_on_error=1:handle_abort=1:allow_addr2line=1',
                             UBSAN_OPTIONS='halt_on_error=1', LLAM_MANAGED_SCHEDULER_VERBOSE='1')
                  result = subprocess.run(['./' + name], env=env, text=True,
                                          stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=120)
                  print(f'{name} native repeat {iteration}/50: {result.returncode}', flush=True)
                  if result.returncode:
                      native_failed = True
                      (out / (name + '-native.log')).write_text(result.stdout)
                      print(result.stdout, flush=True)
                      break
              for iteration in range(1, 51):
                  args = ['gdb', '--batch', '--return-child-result',
                          '-ex', 'set pagination off',
                          '-ex', 'set disable-randomization off',
                          '-ex', 'handle SIGUSR1 SIGUSR2 SIGURG SIGALRM SIGILL nostop noprint pass',
                          '-ex', 'set environment ASAN_OPTIONS=halt_on_error=1:detect_leaks=0:handle_segv=0:handle_abort=0',
                          '-ex', 'set environment UBSAN_OPTIONS=halt_on_error=1',
                          '-ex', 'set environment LLAM_MANAGED_SCHEDULER_VERBOSE=1',
                          '-ex', 'run', '-ex', 'thread apply all bt 40', '--args', './' + name]
                  result = subprocess.run(args, text=True, stdout=subprocess.PIPE,
                                          stderr=subprocess.STDOUT, timeout=120)
                  print(f'{name} debugger repeat {iteration}/50: {result.returncode}', flush=True)
                  if iteration == 1:
                      (out / (name + '-debugger-first.log')).write_text(result.stdout)
                  if result.returncode:
                      (out / (name + '.log')).write_text(result.stdout)
                      print(result.stdout, flush=True)
                      raise SystemExit(1)
              if native_failed:
                  raise SystemExit('Native failure did not reproduce under debugger')
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: runtime-native-failure-stacks
          path: .artifacts/runtime-diagnostic
          if-no-files-found: ignore
