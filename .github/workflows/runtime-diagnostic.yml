name: Runtime diagnostic
on:
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        default: all
        options: [all, linux, macos, tsan]
permissions:
  contents: read

jobs:
  linux-tsan-debug:
    if: inputs.scope == 'tsan'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install native diagnostic dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang gdb liburing-dev
      - name: Build the failing native preemption target
        run: |
          make -j4 CC=clang tsan-test_async_preempt_linux_x86_64 \
            OBJDIR=object-tsan SANITIZER_TARGETS_ENABLED=1 \
            CFLAGS="-std=c11 -Wall -Wextra -Wpedantic -Werror -O1 -g -fno-omit-frame-pointer -fsanitize=thread" \
            LDLIBS="-pthread -luring -lm -ldl -fsanitize=thread"
      - name: Capture the failure with ASLR preserved
        run: |
          set -o pipefail
          mkdir -p .artifacts/runtime-tsan
          gdb --batch --return-child-result \
            -ex 'set pagination off' -ex 'set disable-randomization off' \
            -ex 'handle SIGUSR1 SIGUSR2 SIGURG SIGALRM SIGILL nostop noprint pass' \
            -ex 'handle SIG34 SIG35 SIG36 SIG37 SIG38 SIG39 SIG40 nostop noprint pass' \
            -ex 'set environment TSAN_OPTIONS=halt_on_error=1' \
            -ex run -ex 'thread apply all bt 40' \
            --args ./tsan-test_async_preempt_linux_x86_64 2>&1 | \
            tee .artifacts/runtime-tsan/preemption-stack.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: runtime-tsan-failure-stack
          path: .artifacts/runtime-tsan
          if-no-files-found: ignore

  linux-sanitizer-debug:
    if: inputs.scope == 'all' || inputs.scope == 'linux'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install debugger and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential gdb ca-certificates git python3
      - name: Build matching liburing
        run: |
          liburing_dir="$(mktemp -d "${TMPDIR:-/tmp}/llam-liburing.XXXXXX")"
          trap 'rm -rf "$liburing_dir"' EXIT
          git init "$liburing_dir"
          git -C "$liburing_dir" remote add origin https://github.com/axboe/liburing.git
          git -C "$liburing_dir" fetch --depth 1 origin e3d35ea59d3ba09075ed4d7751e4bb9049cce64a
          git -C "$liburing_dir" checkout --detach FETCH_HEAD
          make -C "$liburing_dir" -j4
          sudo make -C "$liburing_dir" install
          sudo ldconfig
      - name: Build the original sanitizer targets
        run: |
          make -j4 CC=gcc asan-test_execution_lease_internal asan-test_managed_scheduler_internal asan-test_watchdog_liveness_internal \
            OBJDIR=object-asan SANITIZER_TARGETS_ENABLED=1 \
            CFLAGS="-std=c11 -Wall -Wextra -Wpedantic -Werror -O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined" \
            LDLIBS="-pthread -luring -lm -ldl -fsanitize=address,undefined"
      - name: Build ordinary multi-runtime diagnostic
        run: |
          make -j4 CC=gcc test_multi_runtime_core OBJDIR=object-native-diagnostic \
            CFLAGS="-std=c11 -Wall -Wextra -Wpedantic -Werror -O3 -g -DNDEBUG"
      - name: Capture native multi-runtime waits
        run: |
          python3 - <<'PY'
          import ctypes
          import os
          from pathlib import Path
          import subprocess

          out = Path('.artifacts/runtime-diagnostic')
          out.mkdir(parents=True, exist_ok=True)
          prctl = ctypes.CDLL(None, use_errno=True).prctl
          prctl.argtypes = [ctypes.c_int, ctypes.c_ulong, ctypes.c_ulong, ctypes.c_ulong, ctypes.c_ulong]
          def allow_parent_debugger():
              # Only this diagnostic child authorizes its parent and descendants.
              if prctl(0x59616d61, os.getppid(), 0, 0, 0) != 0:
                  raise OSError(ctypes.get_errno(), 'PR_SET_PTRACER failed')

          case = 'destroyed_runtime_io_cancel_does_not_stop_peer_runtime'
          for arguments in (['--case', case], ['--through-case', case]):
              for iteration in range(1, 101):
                  process = subprocess.Popen(['./test_multi_runtime_core'] + arguments, text=True,
                                              stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                              preexec_fn=allow_parent_debugger)
                  try:
                      output, _ = process.communicate(timeout=20)
                  except subprocess.TimeoutExpired:
                      try:
                          debug = subprocess.run(['gdb', '--batch', '-ex', 'set pagination off',
                                                   '-ex', 'thread apply all bt 40', '-p', str(process.pid)],
                                                  text=True, stdout=subprocess.PIPE,
                                                  stderr=subprocess.STDOUT, timeout=30)
                      finally:
                          process.kill()
                          output, _ = process.communicate()
                      report = output + '\n' + debug.stdout
                      (out / 'multi-runtime-hang.log').write_text(report)
                      print(report, flush=True)
                      raise SystemExit('Native multi-runtime wait exceeded diagnostic deadline')
                  print(f'native multi-runtime repeat {iteration}/100: {process.returncode}', flush=True)
                  if process.returncode:
                      (out / 'multi-runtime-failure.log').write_text(output)
                      print(output, flush=True)
                      raise SystemExit(1)
          PY
      - name: Capture native failure stacks
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import subprocess

          out = Path('.artifacts/runtime-diagnostic')
          out.mkdir(parents=True, exist_ok=True)
          subprocess.run(['./asan-test_watchdog_liveness_internal', '--progress-sum'], check=True)
          for name in ('asan-test_execution_lease_internal', 'asan-test_managed_scheduler_internal'):
              native_failed = False
              for iteration in range(1, 51):
                  env = dict(os.environ, ASAN_OPTIONS='halt_on_error=1:handle_abort=1:allow_addr2line=1',
                             UBSAN_OPTIONS='halt_on_error=1', LLAM_MANAGED_SCHEDULER_VERBOSE='1')
                  result = subprocess.run(['./' + name], env=env, text=True,
                                          stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=120)
                  print(f'{name} native repeat {iteration}/50: {result.returncode}', flush=True)
                  if result.returncode:
                      native_failed = True
                      (out / (name + '-native.log')).write_text(result.stdout)
                      print(result.stdout, flush=True)
                      break
              for iteration in range(1, 51):
                  args = ['gdb', '--batch', '--return-child-result',
                          '-ex', 'set pagination off',
                          '-ex', 'set disable-randomization off',
                          '-ex', 'handle SIGUSR1 SIGUSR2 SIGURG SIGALRM SIGILL nostop noprint pass',
                          '-ex', 'set environment ASAN_OPTIONS=halt_on_error=1:detect_leaks=0:handle_segv=0:handle_abort=0',
                          '-ex', 'set environment UBSAN_OPTIONS=halt_on_error=1',
                          '-ex', 'set environment LLAM_MANAGED_SCHEDULER_VERBOSE=1',
                          '-ex', 'run', '-ex', 'thread apply all bt 40', '--args', './' + name]
                  result = subprocess.run(args, text=True, stdout=subprocess.PIPE,
                                          stderr=subprocess.STDOUT, timeout=120)
                  print(f'{name} debugger repeat {iteration}/50: {result.returncode}', flush=True)
                  if iteration == 1:
                      (out / (name + '-debugger-first.log')).write_text(result.stdout)
                  if result.returncode:
                      (out / (name + '.log')).write_text(result.stdout)
                      print(result.stdout, flush=True)
                      raise SystemExit(1)
              if native_failed:
                  raise SystemExit('Native failure did not reproduce under debugger')
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: runtime-native-failure-stacks
          path: .artifacts/runtime-diagnostic
          if-no-files-found: ignore

  macos-intel-performance:
    if: inputs.scope == 'all' || inputs.scope == 'macos'
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          path: after
      - uses: actions/checkout@v6
        with:
          ref: 2623e0f751b8d00431be540be2842aae99ba1854
          submodules: recursive
          path: before
      - name: Build matched native benchmarks
        run: |
          mkdir -p .artifacts/runtime-intel-performance
          sysctl hw.model machdep.cpu.brand_string hw.ncpu hw.cpufrequency > .artifacts/runtime-intel-performance/host.txt
          for source in before after; do
            cmake -S "$source" -B "$source/build/perf" -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER=clang -DCMAKE_ASM_COMPILER=clang
            cmake --build "$source/build/perf" --target bench -j4
          done
          cmake -S after -B after/build/lto -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_ASM_COMPILER=clang -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON
          cmake --build after/build/lto --target bench test_managed_scheduler_internal -j4
          after/build/lto/test_managed_scheduler_internal --errno-migration
      - name: Compare on the same native host
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import statistics
          import subprocess

          samples = []
          out = Path('.artifacts/runtime-intel-performance')
          paths = dict(before='before/build/perf/bench', after='after/build/perf/bench',
                       lto='after/build/lto/bench')
          for case in ('channel_pingpong', 'select_park_wake', 'select_recv_ready', 'select_timeout'):
              for pair in range(12):
                  versions = ['before', 'after', 'lto']
                  order = pair % len(versions)
                  for version in versions[order:] + versions[:order]:
                      env = dict(os.environ, LLAM_BENCH_ONLY=case, LLAM_BENCH_ROUNDS='9',
                                 LLAM_BENCH_WARMUP_ROUNDS='1', LLAM_BENCH_CHANNEL_MESSAGES='1024',
                                 LLAM_BENCH_SELECT_OPS='1024')
                      result = subprocess.run([paths[version]], env=env,
                                              text=True, capture_output=True, check=True, timeout=120)
                      match = re.search(r'ops_per_sec=([0-9.]+)', result.stdout)
                      if match is None:
                          raise RuntimeError(result.stdout + result.stderr)
                      samples.append(dict(case=case, pair=pair + 1, version=version,
                                          ops_per_sec=float(match[1]), stdout=result.stdout))
              (out / 'paired.json').write_text(json.dumps(samples, indent=2) + '\n')
              medians = {version: statistics.median(s['ops_per_sec'] for s in samples
                         if s['case'] == case and s['version'] == version) for version in paths}
              print(case, medians, 'ratio', medians['after'] / medians['before'], flush=True)
          PY
      - name: Check unchanged Intel floors
        run: |
          python3 after/scripts/bench_guard.py --bench "$PWD/after/build/perf/bench" \
            --rounds 9 --select-ops 1024 \
            --min-ops "spawn_join=300000,channel_pingpong=750000,select_recv_ready=3000000,select_park_wake=500000,select_timeout=4000000,io_echo=100000,poll_wake=100000" \
            --out .artifacts/runtime-intel-performance/perf_guard.json
      - name: Inspect link-time optimization separately
        if: ${{ !cancelled() }}
        run: |
          python3 after/scripts/bench_guard.py --bench "$PWD/after/build/lto/bench" \
            --rounds 9 --select-ops 1024 \
            --min-ops "spawn_join=300000,channel_pingpong=750000,select_recv_ready=3000000,select_park_wake=500000,select_timeout=4000000,io_echo=100000,poll_wake=100000" \
            --out .artifacts/runtime-intel-performance/lto_guard.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: runtime-intel-performance
          path: .artifacts/runtime-intel-performance
          if-no-files-found: ignore
