name: Docs

permissions:
  contents: read
  pages: write
  id-token: write

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build-docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          # Each page shows its last change, which needs the history
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: website/requirements.txt

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install documentation dependencies
        run: python -m pip install -r website/requirements.txt

      - name: Build site bundles and fonts
        working-directory: website
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Build documentation
        run: mkdocs build --strict

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Check public API reference coverage
        run: |
          python scripts/test_docs_api_coverage.py
          python scripts/check_docs_api_coverage.py --site-dir site

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: deploy-docs
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
